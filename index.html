<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password generator</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-100" >

<div class=" flex justify-center  bg-white max-w-sm mx-auto m-30  rounded-lg">

    <div  class="p-5 rounded-t-xl ">
        <h1 class="flex justify-center font-bold text-2xl tracking-wide " > Password Generator</h1>
        <p class= " flex justify-center text-sm text-gray-500 m-1.5">Create a strong and secure password</p>

         

        <form action="" class=" flex flex-col  m-4" id="form">
           <div class="relative">
             <input id="input" type="text" class= "w-full bg-slate-200 px-16 py-2 rounded box-border "  placeholder="Generate a Password" >
            
            <button id="copybtn" class="absolute right-3 translate-y-1/2 " type="button"> <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-copy preview-icon"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg></button>
           </div>

           



            <div id="container" class="flex justify-center items-center mt-4 text-sm gap-3">

             <label  class="flex items-center gap-2 text-sm text-slate-600" for="name">
                <input type="checkbox"  id="symbols">
                Symbols
            </label>

             <label class=" flex items-center gap-2 text-sm  text-slate-600" for="name">
                <input  id="uppercase" type="checkbox"   >
                Uppercase
            </label>
            
             <label  class="flex items-center gap-2 text-sm  text-slate-600" for="name">
                <input id="numbers" type="checkbox"  >
                Numbers
            </label>

             

            </div>

            <button id="btn" class="mt-6 bg-indigo-600 px-3 py-2 rounded box-border text-white font-semibold">Generate Password</button>

            
        </form>

       
    </div>

    <!-- <div class="">
        <form action="" id="form">
            <input type="text" id="input" placeholder="Generate your password" >
        </form>
    </div> -->
</div>

  <script src="index.js"></script>
</body>
</html>
